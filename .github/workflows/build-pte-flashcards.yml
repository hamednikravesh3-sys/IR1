name: Build PTE Flashcards APK

on:
  push:
    branches: [ pte-flashcards-apk-20260919 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify embedded flashcard data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          p = Path("flashcards/src/main/assets")
          encoded = "".join((p / f"data{i:02d}.txt").read_text() for i in range(8))
          html = gzip.decompress(base64.b64decode(encoded)).decode("utf-8")
          count = html.count('{"en":')
          print(f"Embedded cards: {count}")
          assert count == 4000, f"Expected 4000 cards, got {count}"
          PY

      - name: Build debug APK
        run: gradle :flashcards:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PTE-Flashcards-4000-APK
          path: flashcards/build/outputs/apk/debug/flashcards-debug.apk
